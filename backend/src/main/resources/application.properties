server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://localhost:3306/jobportal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:c2VjcmV0LWtleS1mb3Itam9iLXBvcnRhbC1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRz}
app.jwt.access-token-expiry-ms=3600000
app.jwt.refresh-token-expiry-ms=604800000

spring.mail.host=${MAIL_HOST:smtp.sendgrid.net}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:apikey}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=noreply@jobportal.com
app.mail.from-name=JobPortal

app.aws.region=${AWS_REGION:ap-south-1}
app.aws.s3.bucket=${AWS_S3_BUCKET:jobportal-files}
app.aws.access-key=${AWS_ACCESS_KEY:}
app.aws.secret-key=${AWS_SECRET_KEY:}

# --- Storage killswitch ---
# Set USE_S3=true (env var) or app.storage.use-s3=true to route uploads to S3.
# When false, files are written to app.storage.local.upload-dir and served at /uploads/**
app.storage.use-s3=${USE_S3:false}
app.storage.local.upload-dir=${UPLOAD_DIR:E:\\ssmt\\upload\\jobportal}

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

logging.level.com.jobportal=INFO
logging.level.org.springframework.security=WARN
